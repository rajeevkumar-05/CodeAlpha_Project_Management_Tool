name: CodeLens PR review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: codelens-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    name: CodeLens review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Trusted default-branch code only. Never checkout, import, install, or execute PR head code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          repository: ${{ github.repository }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review added code and publish findings
        run: node scripts/review-pr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codelens-review-${{ github.event.pull_request.number }}
          path: codelens-report.json
          retention-days: 7
